<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LearningWithUnc · 3D Chess Studio</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111b2a;color:#f4f2e9;font-family:system-ui,Arial}body{display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#182439}header strong{font-size:15px}small{display:block;color:#afbdd0;font-size:11px}button{background:#304864;color:#fff;border:1px solid #5a708c;padding:9px 11px;border-radius:7px;cursor:pointer}button:focus-visible{outline:2px solid #fff}#view{flex:1;min-height:220px;position:relative}#status{position:absolute;bottom:12px;left:12px;font-size:12px;padding:7px 10px;background:#142035d9;border-radius:7px;pointer-events:none}canvas{display:block;touch-action:none}</style></head><body>
<header><div><strong>LearningWithUnc · 3D Chess Studio</strong><small>Mobile preview · Procedural models · Soft studio lighting</small></div><div><button id="top">Top down</button> <button id="angle">Reference angle</button> <button id="reset">Reset view</button></div></header><main id="view"><div id="status">Starting renderer…</div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const host=document.getElementById('view'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color('#252b32');
const camera=new THREE.PerspectiveCamera(29,1,.1,150);camera.up.set(0,0,1);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,0,.25);controls.enablePan=false;controls.minDistance=9;controls.maxDistance=55;
function pose(top){controls.reset();camera.position.set(0,top?0:-9.5,top?34:31);controls.target.set(0,0,.25);camera.lookAt(controls.target);controls.update()}
document.getElementById('top').onclick=()=>pose(true);document.getElementById('angle').onclick=()=>pose(false);document.getElementById('reset').onclick=()=>{camera.zoom=1;camera.updateProjectionMatrix();pose(false)};pose(false);
scene.add(new THREE.HemisphereLight(0xe4e9f0,0x29313b,.65));scene.add(new THREE.AmbientLight(0xffffff,.12));
RectAreaLightUniformsLib.init();const area=new THREE.RectAreaLight(0xffe8c9,4.2,10,8);area.position.set(-3,-3,10);area.lookAt(0,0,0);scene.add(area);
const fill=new THREE.RectAreaLight(0xdde8ff,2.8,10,7);fill.position.set(1.5,6,9);fill.lookAt(0,1.8,.65);scene.add(fill);
// A broad, shadow-free rear kicker lifts the dark pieces off the dark backdrop.
const rearRim=new THREE.DirectionalLight(0xc5d8ff,1.05);rearRim.position.set(1,7,8);rearRim.target.position.set(0,2,0);scene.add(rearRim.target);scene.add(rearRim);
const sun=new THREE.DirectionalLight(0xfff3e5,1.6);sun.position.set(-3,-4,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=7;sun.shadow.camera.bottom=-7;sun.shadow.bias=-.0003;sun.shadow.radius=4;scene.add(sun);

const mat=(color,roughness=.3,metalness=.12)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const ivory=mat('#d8cbb2',.27,.08),ebony=mat('#171c24',.24,.18),blue=mat('#385778',.84,0),cream=mat('#d8d0b9',.85,0),trim=mat('#22262b',.5,.1),gold=mat('#9e8159',.33,.3);
function mesh(g,m,parent,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const BORDER=.36;
// Board and playing surface share the same center. All four physical rails have equal width.
mesh(new THREE.BoxGeometry(8+2*BORDER,8+2*BORDER,.34),trim,scene,0,0,-.23);
// Thin inset outline, avoiding the visually heavy slab edge.
const inset=mat('#777b7e',.42,.25);
mesh(new THREE.BoxGeometry(8.035,8.035,.012),inset,scene,0,0,-.019);
for(let rank=0;rank<8;rank++)for(let file=0;file<8;file++)mesh(new THREE.BoxGeometry(1,1,.032),(rank+file)%2?blue:cream,scene,file-3.5,rank-3.5,.007);
const labelCanvas=document.createElement('canvas');labelCanvas.width=128;labelCanvas.height=128;
const ctx=labelCanvas.getContext('2d');ctx.fillStyle='#ded8c8';ctx.font='bold 82px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
function addBoardLabel(value,x,y){
ctx.clearRect(0,0,128,128);ctx.fillText(value,64,66);
const snapshot=document.createElement('canvas');snapshot.width=128;snapshot.height=128;snapshot.getContext('2d').drawImage(labelCanvas,0,0);const texture=new THREE.CanvasTexture(snapshot);texture.needsUpdate=true;
const label=new THREE.Mesh(new THREE.PlaneGeometry(.20,.20),new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
label.position.set(x,y,-.045);scene.add(label);
}
for(let file=0;file<8;file++)addBoardLabel('ABCDEFGH'[file],file-3.5,-4.18);
for(let rank=0;rank<8;rank++)addBoardLabel(String(rank+1),-4.18,rank-3.5);
const fallbackPieces=[];
const sphere=r=>new THREE.SphereGeometry(r,32,20);
const cyl=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,40);
function lathe(profile,m,parent){const g=new THREE.LatheGeometry(profile.map(([r,z])=>new THREE.Vector2(r,z)),48);g.rotateX(Math.PI/2);return mesh(g,m,parent)}
function piece(type,side,x,y){
const group=new THREE.Group();group.position.set(x,y,.04);group.scale.setScalar(.79);scene.add(group);fallbackPieces.push(group);
const m=side==='w'?ivory:ebony;
const profile=[[0,0],[.31,0],[.36,.035],[.37,.09],[.35,.135],[.3,.17],[.32,.205],[.3,.235],[.22,.265],[.19,.32],[.17,.43],[.19,.53],[.22,.59],[.23,.63],[.19,.665],[0,.665]];
lathe(profile,m,group);
if(type==='p'){lathe([[0,.63],[.19,.63],[.21,.675],[.15,.72],[0,.72]],m,group);mesh(sphere(.19),m,group,0,0,.87)}
if(type==='r'){lathe([[0,.6],[.27,.6],[.29,.68],[.28,.76],[.33,.78],[.33,.87],[.25,.87],[.25,.79],[0,.79]],m,group);for(let a=0;a<6;a++){const t=a*Math.PI/3;const block=mesh(new THREE.BoxGeometry(.18,.15,.15),m,group,.26*Math.cos(t),.26*Math.sin(t),.91);block.rotation.z=t}}
if(type==='b'){lathe([[0,.64],[.22,.64],[.26,.7],[.2,.77],[.13,.83],[.23,.95],[.21,1.1],[.1,1.24],[0,1.28]],m,group);mesh(sphere(.075),m,group,0,0,1.31)}
if(type==='q'){lathe([[0,.64],[.23,.64],[.27,.73],[.2,.8],[.33,1.07],[.31,1.12],[.22,1.15],[0,1.15]],m,group);for(let a=0;a<8;a++){const t=a*Math.PI/4;mesh(sphere(.075),m,group,.27*Math.cos(t),.27*Math.sin(t),1.16)}mesh(sphere(.105),m,group,0,0,1.23)}
if(type==='k'){lathe([[0,.64],[.23,.64],[.28,.73],[.2,.8],[.3,1.1],[.3,1.15],[.21,1.19],[0,1.19]],m,group);mesh(new THREE.BoxGeometry(.11,.12,.36),m,group,0,0,1.35);mesh(new THREE.BoxGeometry(.31,.12,.1),m,group,0,0,1.4)}
if(type==='n'){
// Sculpted, extruded knight profile: curved neck, muzzle, ears, and eyes.
const shape=new THREE.Shape();shape.moveTo(-.22,.62);shape.lineTo(.21,.62);shape.lineTo(.22,.84);shape.lineTo(.09,1.01);shape.lineTo(.17,1.2);shape.lineTo(.04,1.29);shape.lineTo(-.02,1.2);shape.lineTo(-.12,1.32);shape.lineTo(-.2,1.18);shape.lineTo(-.33,1.1);shape.lineTo(-.37,.98);shape.lineTo(-.2,.94);shape.lineTo(-.12,.81);shape.closePath();
const geo=new THREE.ExtrudeGeometry(shape,{depth:.24,bevelEnabled:true,bevelThickness:.055,bevelSize:.05,bevelSegments:3,steps:1});geo.rotateX(Math.PI/2);geo.translate(0,.12,0);mesh(geo,m,group);
mesh(sphere(.038),gold,group,-.19,-.17,1.13);
}
}
const back='rnbqkbnr';
for(let f=0;f<8;f++){piece(back[f],'w',f-3.5,-3.5);piece('p','w',f-3.5,-2.5);piece('p','b',f-3.5,2.5);piece(back[f],'b',f-3.5,3.5)}
// Six genuine, independently sculpted GLB meshes, loaded as a coherent CC0 set.
// Source: https://3dassets.dev/packs/classic-chess-essentials
// If any asset fails, the previous procedural set stays visible rather than leaving an empty board.
const glbIds={p:19472,r:19474,n:19471,b:19466,q:19470,k:19469};
const loader=new GLTFLoader();
const assetEntries=Object.entries(glbIds);
status.textContent='Loading sculpted Staunton GLB pieces…';
Promise.all(assetEntries.map(async ([kind,id])=>{
 const gltf=await loader.loadAsync('https://cdn.3dassets.dev/assets/'+id+'/v1/model.glb');
 return [kind,gltf.scene];
})).then(entries=>{
 const assets=Object.fromEntries(entries);
 const newPieces=[];
 try{
   for(let file=0;file<8;file++){
     for(const [kind,side,y] of [[back[file],'w',-3.5],['p','w',-2.5],['p','b',2.5],[back[file],'b',3.5]]){
       const group=new THREE.Group();
       group.position.set(file-3.5,y,.047);
       const model=assets[kind].clone(true);
       // GLB is Y-up; viewer uses Z-up. The chess pack is authored in metres.
       model.rotation.x=Math.PI/2;
       model.scale.setScalar(15.3);
       model.traverse(o=>{
         if(!o.isMesh)return;
         o.material=side==='w'?ivory:ebony;
         o.castShadow=true;
         o.receiveShadow=true;
       });
       group.add(model);newPieces.push(group);
     }
   }
   for(const group of newPieces)scene.add(group);
   for(const group of fallbackPieces)scene.remove(group);
   status.textContent='v0.9 · Sculpted GLB Staunton set · 32 pieces · CC0';
 }catch(error){
   for(const group of newPieces)scene.remove(group);
   throw error;
 }
}).catch(error=>{
 console.error('GLB chess model loading failed; retaining fallback pieces.',error);
 status.textContent='3D model loading unavailable — procedural fallback displayed';
});
function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(host);resize();
function render(){requestAnimationFrame(render);controls.update();renderer.render(scene,camera)}render();
// Loading status is managed by the GLB loader above.
</script></body></html>
