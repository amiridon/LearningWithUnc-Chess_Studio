<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LearningWithUnc · 3D Chess Studio</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111b2a;color:#f4f2e9;font-family:system-ui,Arial}body{display:flex;flex-direction:column}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#182439}header strong{font-size:15px}small{display:block;color:#afbdd0;font-size:11px}button{background:#304864;color:#fff;border:1px solid #5a708c;padding:9px 11px;border-radius:7px;cursor:pointer}button:focus-visible{outline:2px solid #fff}#view{flex:1;min-height:220px;position:relative}#status{position:absolute;bottom:12px;left:12px;font-size:12px;padding:7px 10px;background:#142035d9;border-radius:7px;pointer-events:none}canvas{display:block;touch-action:none}</style></head><body>
<header id="appHeader"><div><strong>LearningWithUnc · 3D Chess Studio</strong><small>Mobile preview · Procedural models · Soft studio lighting</small></div><div><button id="top">Top down</button> <button id="angle">Reference angle</button> <button id="fit">Fit board</button> <button id="present">Presentation</button> <button id="reset">Reset view</button></div></header><main id="view"><div id="status">Starting renderer…</div></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RectAreaLightUniformsLib} from 'three/addons/lights/RectAreaLightUniformsLib.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
const host=document.getElementById('view'),status=document.getElementById('status'),appHeader=document.getElementById('appHeader');
const params=new URLSearchParams(window.location.search);
const scene=new THREE.Scene();scene.background=new THREE.Color('#5f718b');
const camera=new THREE.PerspectiveCamera(34,1,.1,150);camera.up.set(0,0,1);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.54;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;host.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,-.6,.26);controls.enablePan=false;controls.minDistance=6;controls.maxDistance=38;controls.maxPolarAngle=Math.PI*.48;controls.minPolarAngle=Math.PI*.18;
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
let livePieces=[];

function fitBoard(){pose('fit')}
function setPresentationMode(enabled){appHeader.style.display=enabled?'none':'';if(params.get('hud')==='0')status.style.display=enabled?'none':''}
document.getElementById('top').onclick=()=>pose('top');document.getElementById('angle').onclick=()=>pose('reference');document.getElementById('fit').onclick=()=>fitBoard();document.getElementById('present').onclick=()=>setPresentationMode(appHeader.style.display!=='none');document.getElementById('reset').onclick=()=>{camera.zoom=1;camera.updateProjectionMatrix();pose('reference')};
window.addEventListener('keydown',event=>{if(event.key==='r'||event.key==='R'){pose('reference')}else if(event.key==='f'||event.key==='F'){fitBoard()}else if(event.key==='Escape'){setPresentationMode(false)}});
renderer.domElement.addEventListener('dblclick',event=>{if(!livePieces.length)return;const rect=renderer.domElement.getBoundingClientRect();pointer.x=((event.clientX-rect.left)/rect.width)*2-1;pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObjects(livePieces,true)[0];if(!hit)return;const offset=camera.position.clone().sub(controls.target);controls.target.lerp(hit.point,.85);camera.position.copy(controls.target).add(offset);controls.update()});
pose(params.get('pose')||'reference');
if(params.get('presentation')==='1')setPresentationMode(true);
scene.add(new THREE.HemisphereLight(0xe8eef8,0x18212e,.34));scene.add(new THREE.AmbientLight(0xffffff,.012));
RectAreaLightUniformsLib.init();
const keyWarm=new THREE.RectAreaLight(0xffdcb8,8.8,11.2,8.8);keyWarm.position.set(-2.7,-3.3,10.8);keyWarm.lookAt(.15,-.55,.42);scene.add(keyWarm);
const fillCool=new THREE.RectAreaLight(0xcddbf0,1.05,8.4,7.3);fillCool.position.set(4.75,5.6,7.9);fillCool.lookAt(.2,1.1,.65);scene.add(fillCool);
const rimLight=new THREE.DirectionalLight(0xc2d7f2,.44);rimLight.position.set(2.9,8.1,7.4);rimLight.target.position.set(0,2.2,.2);scene.add(rimLight.target);scene.add(rimLight);
const shadowKey=new THREE.DirectionalLight(0xffdfbb,1.2);shadowKey.position.set(-3.1,-4.1,10.4);shadowKey.castShadow=true;shadowKey.shadow.mapSize.set(2048,2048);shadowKey.shadow.camera.left=-7;shadowKey.shadow.camera.right=7;shadowKey.shadow.camera.top=7;shadowKey.shadow.camera.bottom=-7;shadowKey.shadow.bias=-.00024;shadowKey.shadow.radius=4;scene.add(shadowKey);

const mat=(color,roughness=.3,metalness=.12,clearcoat=.0,clearcoatRoughness=.2)=>new THREE.MeshPhysicalMaterial({color,roughness,metalness,clearcoat,clearcoatRoughness});
const ivory=mat('#d8c9ac',.34,.01,.34,.22),ebony=mat('#0f1722',.08,.29,1,.06),blue=mat('#45648f',.58,.01,.04,.3),cream=mat('#dbc8a3',.61,.01,.04,.31),trim=mat('#171f2a',.44,.06,.2,.25),gold=mat('#9e8159',.31,.34,.2,.25);
function mesh(g,m,parent,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
const BORDER=.36;
mesh(new THREE.BoxGeometry(26,26,.7),mat('#1f232a',.92,.02),scene,0,0,-.64);
mesh(new THREE.BoxGeometry(18,4.2,1.4),mat('#323a45',.85,.03),scene,0,8.5,.05);
// Board and playing surface share the same center. All four physical rails have equal width.
mesh(new THREE.BoxGeometry(8+2*BORDER,8+2*BORDER,.34),trim,scene,0,0,-.23);
// Thin inset outline, avoiding the visually heavy slab edge.
const inset=mat('#98a0aa',.38,.18);
mesh(new THREE.BoxGeometry(8.035,8.035,.012),inset,scene,0,0,-.019);
function makeSquareMaterial(base,stripe){const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,256,256);x.strokeStyle=stripe;x.lineWidth=3;for(let i=-256;i<512;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i+256,256);x.stroke()}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1,1);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return new THREE.MeshStandardMaterial({map:t,roughness:.62,metalness:.02})}
const blueSquare=makeSquareMaterial('#6883ae','rgba(255,255,255,.095)');
const creamSquare=makeSquareMaterial('#e6ddc8','rgba(90,93,97,.06)');
for(let rank=0;rank<8;rank++)for(let file=0;file<8;file++)mesh(new THREE.BoxGeometry(1,1,.032),(rank+file)%2?blueSquare:creamSquare,scene,file-3.5,rank-3.5,.007);
const labelCanvas=document.createElement('canvas');labelCanvas.width=128;labelCanvas.height=128;
const ctx=labelCanvas.getContext('2d');ctx.fillStyle='#ecebe7';ctx.font='bold 78px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
function addBoardLabel(value,x,y){
ctx.clearRect(0,0,128,128);ctx.fillText(value,64,66);
const snapshot=document.createElement('canvas');snapshot.width=128;snapshot.height=128;snapshot.getContext('2d').drawImage(labelCanvas,0,0);const texture=new THREE.CanvasTexture(snapshot);texture.needsUpdate=true;
const label=new THREE.Mesh(new THREE.PlaneGeometry(.20,.20),new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
label.position.set(x,y,-.045);scene.add(label);
}
for(let file=0;file<8;file++)addBoardLabel('ABCDEFGH'[file],file-3.5,-4.18);
for(let rank=0;rank<8;rank++)addBoardLabel(String(rank+1),-4.18,rank-3.5);
const fallbackPieces=[];
const sphere=r=>new THREE.SphereGeometry(r,32,20);
const cyl=(a,b,h)=>new THREE.CylinderGeometry(a,b,h,40);
function lathe(profile,m,parent){const g=new THREE.LatheGeometry(profile.map(([r,z])=>new THREE.Vector2(r,z)),48);g.rotateX(Math.PI/2);return mesh(g,m,parent)}
function piece(type,side,x,y){
const group=new THREE.Group();group.position.set(x,y,.04);group.scale.setScalar(.79);scene.add(group);fallbackPieces.push(group);
const m=side==='w'?ivory:ebony;
const profile=[[0,0],[.31,0],[.36,.035],[.37,.09],[.35,.135],[.3,.17],[.32,.205],[.3,.235],[.22,.265],[.19,.32],[.17,.43],[.19,.53],[.22,.59],[.23,.63],[.19,.665],[0,.665]];
lathe(profile,m,group);
if(type==='p'){lathe([[0,.63],[.19,.63],[.21,.675],[.15,.72],[0,.72]],m,group);mesh(sphere(.19),m,group,0,0,.87)}
if(type==='r'){lathe([[0,.6],[.27,.6],[.29,.68],[.28,.76],[.33,.78],[.33,.87],[.25,.87],[.25,.79],[0,.79]],m,group);for(let a=0;a<6;a++){const t=a*Math.PI/3;const block=mesh(new THREE.BoxGeometry(.18,.15,.15),m,group,.26*Math.cos(t),.26*Math.sin(t),.91);block.rotation.z=t}}
if(type==='b'){lathe([[0,.64],[.22,.64],[.26,.7],[.2,.77],[.13,.83],[.23,.95],[.21,1.1],[.1,1.24],[0,1.28]],m,group);mesh(sphere(.075),m,group,0,0,1.31)}
if(type==='q'){lathe([[0,.64],[.23,.64],[.27,.73],[.2,.8],[.33,1.07],[.31,1.12],[.22,1.15],[0,1.15]],m,group);for(let a=0;a<8;a++){const t=a*Math.PI/4;mesh(sphere(.075),m,group,.27*Math.cos(t),.27*Math.sin(t),1.16)}mesh(sphere(.105),m,group,0,0,1.23)}
if(type==='k'){lathe([[0,.64],[.23,.64],[.28,.73],[.2,.8],[.3,1.1],[.3,1.15],[.21,1.19],[0,1.19]],m,group);mesh(new THREE.BoxGeometry(.11,.12,.36),m,group,0,0,1.35);mesh(new THREE.BoxGeometry(.31,.12,.1),m,group,0,0,1.4)}
if(type==='n'){
// Sculpted, extruded knight profile: curved neck, muzzle, ears, and eyes.
const shape=new THREE.Shape();shape.moveTo(-.22,.62);shape.lineTo(.21,.62);shape.lineTo(.22,.84);shape.lineTo(.09,1.01);shape.lineTo(.17,1.2);shape.lineTo(.04,1.29);shape.lineTo(-.02,1.2);shape.lineTo(-.12,1.32);shape.lineTo(-.2,1.18);shape.lineTo(-.33,1.1);shape.lineTo(-.37,.98);shape.lineTo(-.2,.94);shape.lineTo(-.12,.81);shape.closePath();
const geo=new THREE.ExtrudeGeometry(shape,{depth:.24,bevelEnabled:true,bevelThickness:.055,bevelSize:.05,bevelSegments:3,steps:1});geo.rotateX(Math.PI/2);geo.translate(0,.12,0);mesh(geo,m,group);
mesh(sphere(.038),gold,group,-.19,-.17,1.13);
}
}
const back='rnbqkbnr';
for(let f=0;f<8;f++){piece(back[f],'b',f-3.5,3.5);piece('p','b',f-3.5,2.5);piece('p','w',f-3.5,-2.5);piece(back[f],'w',f-3.5,-3.5)}
// Real sculpted meshes from Poly Haven's CC0 Chess Set, via a public GitHub mirror.
// The previous 3dassets.dev pack had obviously angular silhouettes in user screenshots.
// GLTFLoader resolves the adjacent chess_set.bin automatically.
const MODEL_URL='https://raw.githubusercontent.com/Mike1934F/3d-chess/main/assets/chess_set.gltf';
const loader=new GLTFLoader();
status.textContent='Loading Poly Haven sculpted chess meshes…';
loader.load(MODEL_URL, gltf=>{
  const newPieces=[];
  const names={p:'pawn',r:'rook',n:'knight',b:'bishop',q:'queen',k:'king'};
  // Target visible heights in board-square units. The previous model was undersized.
  const heights={p:.85,r:1.03,n:1.14,b:1.17,q:1.33,k:1.43};
  const make=(type,side,x,y)=>{
    const prefix='piece_'+names[type]+'_'+(side==='w'?'white':'black');
    const original=gltf.scene.children.find(obj=>obj.name===prefix || obj.name.startsWith(prefix+'_'));
    if(!original)throw Error('Missing model: '+prefix);
    const wrapper=new THREE.Group();
    wrapper.position.set(x,y,.04);
    const orientation=new THREE.Group();orientation.rotation.x=Math.PI/2;
    const model=original.clone(true);
    model.position.set(0,0,0);
    model.rotation.set(0,0,0);
    model.scale.set(1,1,1);
    // Source is Y-up. Recenter the native mesh on the base before rotating to Z-up.
    const bbox=new THREE.Box3().setFromObject(model);
    const center=bbox.getCenter(new THREE.Vector3());
    const size=bbox.getSize(new THREE.Vector3());
    if(size.y<=.00001)throw Error('Invalid mesh height: '+prefix);
    model.position.set(-center.x,-bbox.min.y,-center.z);
    // Preserve each mesh's proportions, but keep its footprint clear of neighboring squares.
    const heightScale=heights[type]/size.y;
    const footprint=Math.max(size.x,size.z);
    const scale=Math.min(heightScale,.82/Math.max(footprint,.00001));
    orientation.scale.setScalar(scale);
    model.traverse(o=>{if(!o.isMesh)return;
      o.material=side==='w'?ivory:ebony;
      o.castShadow=true;o.receiveShadow=true;
      if(o.geometry && !o.geometry.attributes.normal)o.geometry.computeVertexNormals();
    });
    orientation.add(model);wrapper.add(orientation);
    newPieces.push(wrapper);
  };
  try{
    for(let file=0;file<8;file++){
      make(back[file],'b',file-3.5,3.5);
      make('p','b',file-3.5,2.5);
      make('p','w',file-3.5,-2.5);
      make(back[file],'w',file-3.5,-3.5);
    }
    newPieces.forEach(obj=>scene.add(obj));
    fallbackPieces.forEach(obj=>scene.remove(obj));
    livePieces=newPieces;
    status.textContent='v1.1 · Larger Staunton pieces · 32 sculpted meshes';
    window.__sceneReady=true;
  }catch(err){newPieces.forEach(obj=>scene.remove(obj));livePieces=fallbackPieces;status.textContent='Model issue: procedural fallback displayed';window.__sceneReady=true;console.error(err)}
},undefined,err=>{
  livePieces=fallbackPieces;
  status.textContent='Model download unavailable: fallback pieces displayed';
  window.__sceneReady=true;
  console.error('Poly Haven model failed to load',err);
});
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(1,1),.012,.06,1.15);composer.addPass(bloom);
const vignette=document.createElement('div');vignette.style.cssText='position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,rgba(255,255,255,0) 60%,rgba(5,7,11,.16) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 79%,rgba(0,0,0,.16) 100%)';host.append(vignette);
function addHighlight(file,rank,color='#f6df63'){const glow=new THREE.Mesh(new THREE.PlaneGeometry(.98,.98),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.5,depthWrite:false,side:THREE.DoubleSide}));glow.position.set(file-3.5,rank-3.5,.055);scene.add(glow)}addHighlight(7,8);addHighlight(6,5,'#f2d451');
function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);composer.setSize(w,h)}new ResizeObserver(resize).observe(host);resize();

</script></body></html>
